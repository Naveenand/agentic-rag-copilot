[project]
name = "agentic-rag-copilot"
version = "2.1.0"
description = "Private-knowledge-first Agentic RAG copilot (LangGraph + FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4==4.15.0",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "langchain-core==1.6.10",
    "langchain-huggingface==1.2.3",
    "langchain-openai==1.7.1",
    "langchain-pinecone==0.2.13",
    "langchain-tavily==0.2.18",
    "langchain-text-splitters==1.1.3",
    "langgraph==1.2.15",
    "langgraph-checkpoint-sqlite==3.1.2",
    "pinecone==7.3.0",
    "pydantic-settings==2.15.0",
    "pypdf==5.9.0",
    "pytest==9.1.1",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "rank-bm25==0.2.2",
    "reportlab==5.0.1",
    "requests==2.34.2",
    "ruff==0.17.0",
    "sentence-transformers==6.1.0",
    "uvicorn[standard]==0.53.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501", "UP007", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
